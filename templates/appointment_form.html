{% extends "base.html" %}
{% block title %}Book appointment{% endblock %}
{% block content %}
<h1 class="h3 mb-3">Book appointment</h1>
<form method="post" class="card p-4">
  <div class="row g-3">
    <div class="col-md-6">
      <label class="form-label">Patient</label>
      <select class="form-select" name="patient_id" required>
        {% for p in patients %}
          <option value="{{ p.patient_id }}" {% if (request.form.get('patient_id')|int(0) or selected_patient) == p.patient_id %}selected{% endif %}>
            {{ p.first_name }} {{ p.last_name }} (#{{ p.patient_id }})
          </option>
        {% endfor %}
      </select>
    </div>
    <div class="col-md-6">
      <label class="form-label">Doctor</label>
      <select class="form-select" name="doctor_id" required>
        {% for d in doctors %}
          <option value="{{ d.doctor_id }}" {% if request.form.get('doctor_id')|int(0) == d.doctor_id %}selected{% endif %}>
            {{ d.doctor_name }} · {{ d.specialization }} · {{ d.consultation_fee|money }}
          </option>
        {% endfor %}
      </select>
    </div>
    <div class="col-md-6">
      <label class="form-label">Date and time</label>
      <input class="form-control" type="datetime-local" name="appointment_time" step="900"
             value="{{ request.form.get('appointment_time') or '' }}" required>
      <div class="form-text">OPD hours are 08:00 to 20:00 (checked by the app). A unique index stops a doctor having two patients in the same slot.</div>
    </div>
    <div class="col-md-6">
      <label class="form-label">Reason</label>
      <input class="form-control" name="reason" value="{{ request.form.get('reason') or '' }}">
    </div>
  </div>
  <div class="mt-4 d-flex gap-2">
    <button class="btn btn-primary">Book</button>
    <a class="btn btn-outline-secondary" href="{{ url_for('appointments') }}">Cancel</a>
  </div>
</form>
{% endblock %}
